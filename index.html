<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Below the Signal</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" width="320" height="180" aria-label="Below the Signal game" tabindex="-1"></canvas>
      <section id="hud" aria-live="polite">
        <div id="crosshair">+</div>
        <div id="location-name" aria-live="polite"></div>
        <div id="prompt"></div>
        <canvas id="minimap" width="192" height="192" aria-label="Frameless explored map: north up, bright visible walls, dim explored walls, gold exits" data-position="top-left"></canvas>
        <div id="debug-info" aria-label="Performance and debug information" aria-live="off" hidden></div>
      </section>
      <div id="error" role="alert"></div>
      <div id="pause-shade">
        <section id="pause-panel" role="dialog" aria-modal="true" aria-labelledby="pause-title" tabindex="-1">
          <p class="settings-kicker">BELOW THE SIGNAL</p>
          <h1 id="pause-title">Paused</h1>
          <p class="pause-intro">The tunnels can wait.</p>
          <p id="pause-capture-error" class="pause-help" role="alert"></p>
          <nav aria-label="Pause actions">
            <button id="pause-resume" type="button">Resume</button>
            <button id="pause-settings" type="button">Settings</button>
          </nav>
          <p class="pause-help">W / S or ↑ / ↓ select · Enter confirm · Esc resume</p>
        </section>
      </div>
      <div id="settings-shade" hidden>
        <section id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
          <header class="settings-header">
            <div><p class="settings-kicker">FIELD EQUIPMENT</p><h1 id="settings-title">Control settings</h1></div>
            <button id="settings-close" class="settings-icon-button" type="button" aria-label="Close settings">×</button>
          </header>
          <p class="settings-intro">Tune movement and camera response. Changes apply immediately.</p>
          <label class="setting-row" for="setting-walk">
            <span class="setting-copy"><span class="setting-name">Walking speed</span><span class="setting-description">Movement pace through the tunnels</span></span>
            <span class="setting-control"><output id="setting-walk-value" for="setting-walk"></output><input id="setting-walk" type="range" min="1" max="6" step="0.1" /></span>
          </label>
          <label class="setting-row" for="setting-bob">
            <span class="setting-copy"><span class="setting-name">Bobbing rate</span><span class="setting-description">Footstep camera rhythm · zero disables bob</span></span>
            <span class="setting-control"><output id="setting-bob-value" for="setting-bob"></output><input id="setting-bob" type="range" min="0" max="12" step="0.1" /></span>
          </label>
          <label class="setting-row" for="setting-mouse">
            <span class="setting-copy"><span class="setting-name">Mouse speed</span><span class="setting-description">Horizontal and vertical look sensitivity</span></span>
            <span class="setting-control"><output id="setting-mouse-value" for="setting-mouse"></output><input id="setting-mouse" type="range" min="0.0005" max="0.006" step="0.0001" /></span>
          </label>
          <label class="setting-row" for="setting-ao">
            <span class="setting-copy"><span class="setting-name">Ambient occlusion</span><span class="setting-description">Darkens wall corners and floor / ceiling contacts · zero disables</span></span>
            <span class="setting-control"><output id="setting-ao-value" for="setting-ao"></output><input id="setting-ao" type="range" min="0" max="1" step="0.05" /></span>
          </label>
          <label class="setting-row" for="setting-minimap-size">
            <span class="setting-copy"><span class="setting-name">Minimap size</span><span class="setting-description">On-screen map size, independent of zoom</span></span>
            <span class="setting-control"><output id="setting-minimap-size-value" for="setting-minimap-size"></output><input id="setting-minimap-size" type="range" min="96" max="256" step="8" /></span>
          </label>
          <label class="setting-row" for="setting-minimap-range">
            <span class="setting-copy"><span class="setting-name">Minimap range</span><span class="setting-description">Tiles shown around you · lower is closer</span></span>
            <span class="setting-control"><output id="setting-minimap-range-value" for="setting-minimap-range"></output><input id="setting-minimap-range" type="range" min="8" max="40" step="1" /></span>
          </label>
          <label class="setting-row" for="setting-minimap-position">
            <span class="setting-copy"><span class="setting-name">Minimap position</span><span class="setting-description">Choose a screen corner</span></span>
            <span class="setting-control"><select id="setting-minimap-position"><option value="top-left">Top left</option><option value="top-right">Top right</option><option value="bottom-left">Bottom left</option><option value="bottom-right">Bottom right</option></select></span>
          </label>
          <label class="setting-row" for="setting-max-fps">
            <span class="setting-copy"><span class="setting-name">Frame rate limit</span><span class="setting-description">1–119 FPS, or Unlimited at the end</span></span>
            <span class="setting-control"><output id="setting-max-fps-value" for="setting-max-fps"></output><input id="setting-max-fps" type="range" min="1" max="120" step="1" /></span>
          </label>
            <legend>Performance &amp; debug information</legend>
            <label class="debug-visible-row"><input id="setting-debug-visible" type="checkbox" /><span>Show top-right performance panel</span></label>
            <label class="setting-row" for="setting-debug-opacity">
              <span class="setting-copy"><span class="setting-name">Text opacity</span><span class="setting-description">Panel text readability</span></span>
              <span class="setting-control"><output id="setting-debug-opacity-value" for="setting-debug-opacity"></output><input id="setting-debug-opacity" type="range" min="0.1" max="1" step="0.05" /></span>
            </label>
            <label class="setting-row" for="setting-debug-size">
              <span class="setting-copy"><span class="setting-name">Text size</span><span class="setting-description">Panel font size</span></span>
              <span class="setting-control"><output id="setting-debug-size-value" for="setting-debug-size"></output><input id="setting-debug-size" type="range" min="8" max="22" step="1" /></span>
            </label>
            <div id="debug-field-options" class="debug-field-options"><span class="setting-name">Information to show</span></div>
          </fieldset>
          <footer class="settings-footer"><span>Settings save automatically on this device.</span><button id="settings-done" type="button">Done</button></footer>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
